<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Krachwerk: ein Klatscher als Ausschlag um die Mittellinie, Pink aus „Eigene“ (--cat-own) auf Phosphor-Schwarz (--bg) -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9CC8"/>
      <stop offset="0.5" stop-color="#FF62A5"/>
      <stop offset="1" stop-color="#FF9CC8"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#16171A"/>
  <g fill="url(#k)" filter="url(#g)">
    <rect x="7" y="28" width="4.5" height="8" rx="2.25"/>
    <rect x="14.5" y="22" width="4.5" height="20" rx="2.25"/>
    <rect x="22" y="9" width="4.5" height="46" rx="2.25"/>
    <rect x="29.75" y="15" width="4.5" height="34" rx="2.25"/>
    <rect x="37.5" y="20" width="4.5" height="24" rx="2.25"/>
    <rect x="45" y="25" width="4.5" height="14" rx="2.25"/>
    <rect x="52.5" y="29" width="4.5" height="6" rx="2.25"/>
  </g>
</svg>
